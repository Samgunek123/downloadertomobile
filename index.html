
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DownloaderToMobile</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f1f5f9;color:#172033;
 font-family:Arial,sans-serif;
}
header{
 background:#101827;color:white;padding:22px;
 text-align:center;font-size:25px;font-weight:bold;
}
header span{color:#38bdf8}
main{max-width:750px;margin:55px auto;padding:20px}
.hero{text-align:center;margin-bottom:30px}
.hero h1{font-size:36px}
.hero h1 span{color:#0284c7}
.hero p{color:#64748b;line-height:1.6}
.platforms{
 display:flex;justify-content:center;
 gap:12px;flex-wrap:wrap;margin:25px 0;
}
.platform{
 background:white;padding:13px 20px;
 border-radius:12px;font-weight:bold;
}
.card{
 background:white;padding:25px;
 border-radius:18px;
 box-shadow:0 5px 25px #0001;
}
label{display:block;font-weight:bold;margin-bottom:12px}
input[type=url]{
 width:100%;padding:16px;
 border:1px solid #cbd5e1;
 border-radius:10px;font-size:15px;
 margin-bottom:12px;
}
button,.download{
 display:block;width:100%;padding:15px;
 border:0;border-radius:10px;
 background:#0284c7;color:white;
 font-weight:bold;font-size:16px;
 cursor:pointer;text-align:center;
 text-decoration:none;
}
button:hover,.download:hover{background:#0369a1}
#result{
 display:none;margin-top:22px;
 background:#f0f9ff;padding:18px;
 border-radius:12px;line-height:1.6;
 overflow-wrap:anywhere;
}
video{width:100%;margin-top:15px;border-radius:10px}
.download{background:#16a34a;margin-top:15px}
.note{font-size:13px;color:#64748b;margin-top:18px}
footer{text-align:center;color:#64748b;padding:30px}
@media(max-width:550px){
 main{margin:25px auto}
 .hero h1{font-size:29px}
 .card{padding:18px}
}
</style>
</head>
<body>

<header>⬇ Downloader<span>ToMobile</span></header>

<main>
<section class="hero">
<h1>Video <span>Downloader</span></h1>
<p>Preview and access your permitted video files easily.</p>
</section>

<div class="platforms">
<div class="platform">🔵 Facebook</div>
<div class="platform">▶ YouTube</div>
<div class="platform">🎵 TikTok</div>
</div>

<section class="card">
<label for="videoURL">Paste Video Link</label>
<input type="url" id="videoURL"
placeholder="Paste your video URL here">

<button onclick="checkVideo()">Find Video</button>

<div id="result"></div>

<p class="note">
Only download videos you own or have permission to download.
Platform restrictions apply.
</p>
</section>
</main>

<footer>
© 2026 DownloaderToMobile
</footer>

<script>
function checkVideo(){

 const value=document.getElementById("videoURL").value.trim();
 const result=document.getElementById("result");

 result.style.display="block";
 result.innerHTML="";

 let url;

 try{
  url=new URL(value);
  if(!["https:","http:"].includes(url.protocol)) throw Error();
 }catch(e){
  result.innerHTML="❌ Please enter a valid video URL.";
  return;
 }

 const host=url.hostname.toLowerCase();

 const youtube=
 host==="youtube.com" || host.endsWith(".youtube.com") ||
 host==="youtu.be";

 const facebook=
 host==="facebook.com" || host.endsWith(".facebook.com") ||
 host==="fb.watch";

 const tiktok=
 host==="tiktok.com" || host.endsWith(".tiktok.com");

 if(youtube){
  let id=host==="youtu.be"
   ?url.pathname.slice(1)
   :url.searchParams.get("v");

  result.innerHTML="<h3>✅ YouTube Video Found</h3>";

  if(id && /^[a-zA-Z0-9_-]{11}$/.test(id)){
   const frame=document.createElement("iframe");
   frame.src="https://www.youtube-nocookie.com/embed/"+id;
   frame.style.width="100%";
   frame.style.aspectRatio="16/9";
   frame.style.border="0";
   frame.style.marginTop="15px";
   frame.allowFullscreen=true;
   result.appendChild(frame);
  }

  const p=document.createElement("p");
  p.textContent="Use YouTube's official download options where available.";
  result.appendChild(p);
  return;
 }

 if(facebook || tiktok){
  result.innerHTML=
   "<h3>✅ "+(facebook?"Facebook":"TikTok")+" Link Found</h3>"+
   "<p>Link recognized successfully.</p>"+
   "<p>Use the platform's official sharing or download options where available. This website does not extract restricted video files.</p>";
  return;
 }

 const ext=url.pathname.split(".").pop().toLowerCase();

 if(!["mp4","webm","ogg"].includes(ext)){
  result.innerHTML=
   "<h3>Video Link Received</h3>"+
   "<p>This is not a direct supported video file link.</p>"+
   "<p>Please use a direct MP4, WebM or OGG file URL that you are authorized to download.</p>";
  return;
 }

 result.innerHTML="<h3>✅ Video File Found!</h3>";

 const video=document.createElement("video");
 video.src=url.href;
 video.controls=true;
 video.playsInline=true;
 result.appendChild(video);

 const quality=document.createElement("p");
 quality.innerHTML="<b>Quality:</b> Original file quality";
 result.appendChild(quality);

 const link=document.createElement("a");
 link.href=url.href;
 link.download="";
 link.className="download";
 link.textContent="⬇ Download Video";
 link.target="_blank";
 link.rel="noopener";
 result.appendChild(link);

 const note=document.createElement("p");
 note.className="note";
 note.textContent=
 "Download availability depends on the video host. Cross-origin restrictions may prevent direct downloads.";
 result.appendChild(note);
}
</script>

</body>
</html>
